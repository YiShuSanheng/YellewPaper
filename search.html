<!-- search.html 主体 -->
<div class="p-6 space-y-6">
  <h1 class="text-2xl font-semibold">文件搜索中心</h1>

  <!-- 上传区 -->
  <div id="dropZone"
       class="border-2 border-dashed border-slate-300 rounded-lg p-8 text-center hover:border-blue-400 transition">
    <p class="text-slate-500">拖拽文件到此处或 <label for="fileInput" class="text-blue-600 underline cursor-pointer">点击选择</label></p>
    <input id="fileInput" type="file" multiple class="hidden">
  </div>

  <!-- 搜索栏 -->
  <div class="flex gap-2">
    <input id="searchInput" type="text" placeholder="关键字 …" class="flex-1 px-3 py-2 border rounded">
    <button onclick="doSearch()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">搜索</button>
  </div>

  <!-- 结果区 -->
  <ul id="results" class="space-y-2"></ul>
</div>

<script type="module">
  import { indexFile, search } from './utils/fileSearch.js';

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const searchInput = document.getElementById('searchInput');
  const results = document.getElementById('results');

  let INDEX = []; // 内存索引

  /* 上传逻辑 */
  const handleFiles = async (files) => {
    for (const file of files) {
      const text = await file.text();
      INDEX.push(...indexFile(file.name, text));
    }
    alert(`已索引 ${files.length} 个文件`);
  };
  fileInput.addEventListener('change', e => handleFiles([...e.target.files]));
  dropZone.addEventListener('dragover', e => e.preventDefault());
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    handleFiles([...e.dataTransfer.files]);
  });

  /* 搜索逻辑 */
  window.doSearch = () => {
    const kw = searchInput.value.trim();
    const hits = search(INDEX, kw);
    results.innerHTML = hits.map(h => `
      <li class="p-3 bg-white rounded shadow">
        <div class="font-semibold text-blue-700">${h.file}</div>
        <div class="text-sm text-slate-600">${h.line}</div>
      </li>`).join('');
  };
</script>
