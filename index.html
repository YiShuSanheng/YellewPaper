<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Horizonier's Academic Universe</title>
  <style>
    :root {
      --accent: #007acc;
      --card-bg: #ffffff;
      --body-bg: #f5f7fa;
      --text: #222;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(0,0,0,.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      background: var(--body-bg);
      color: var(--text);
      padding: 3rem 1rem;
      line-height: 1.6;
    }
    h1 { text-align: center; margin-bottom: 2.5rem; font-size: 2rem; letter-spacing: 1px; }
    .grid {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem 1.25rem;
      transition: transform .25s, box-shadow .25s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    .card h2 {
      font-size: 1.1rem;
      margin-bottom: .75rem;
      color: var(--accent);
    }
    .card a {
      color: var(--text);
      text-decoration: none;
      font-size: .95rem;
      margin: .35rem 0;
      display: inline-flex;
      align-items: center;
    }
    .card a::before {
      content: "▸";
      margin-right: .4rem;
      color: var(--accent);
    }
    .card a:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <h1>Horizonier's Academic Universe</h1>

  <section class="grid">
    <!-- Foldseek -->
    <div class="card">
      <h2>Foldseek</h2>
      <a href="https://search.foldseek.com" target="_blank" rel="noopener">在线结构搜索</a>
    </div>

    <!-- ROSIE -->
    <div class="card">
      <h2>ROSIE</h2>
      <a href="https://rosie.rosettacommons.org" target="_blank" rel="noopener">Rosetta 在线计算入口</a>
    </div>

    <!-- HotSpot -->
    <div class="card">
      <h2>HotSpot Wizard</h2>
      <a href="https://loschmidt.chemi.muni.cz/hotspotwizard" target="_blank" rel="noopener">蛋白质热点突变设计</a>
    </div>

    <!-- VenusFactory -->
    <div class="card">
      <h2>VenusFactory</h2>
      <a href="https://venusfactory.cn/playground" target="_blank" rel="noopener">在线平台</a>
      <a href="https://github.com/ai4protein/VenusFactory" target="_blank" rel="noopener">GitHub 仓库</a>
    </div>

    <!-- GitHub 组织 -->
    <div class="card">
      <h2>AI4Protein</h2>
      <a href="https://github.com/ai4protein" target="_blank" rel="noopener">全部开源仓库</a>
    </div>
<!-- ColabHub -->
<div class="card">
  <h2>ColabHub</h2>
  <a href="https://colab.research.google.com" target="_blank" rel="noopener">Google Colab 主站</a>
</div>

<!-- Web of Science -->
<div class="card">
  <h2>Web of Science</h2>
  <a href="https://webofscience.clarivate.cn" target="_blank" rel="noopener">中国镜像（内网/IP 认证）</a>
</div>
  </section>
</body>
</html>
